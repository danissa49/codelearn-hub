<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="tabName">CodeLearn Hub</title>
    <link rel="stylesheet" href="styles/main.css" />
    <script>
      const role = localStorage.getItem("role");
      if (!role) {
        // Not logged in, redirect to login
        window.location.href = "login.html";
      } else {
        if (role !== "user") {
          alert("Access denied. Users only.");
          window.location.href = "login.html";
        }
      }
    </script>
  </head>
  <body class="">
    <div class="page-wrap">
      <!-- Navigation Bar -->
      <header>
        <div class="header-container">
          <img
            src="assets/danissa_logo.png"
            alt="Website Logo"
            class="logo-img"
          />
          <h2 class="logo-text">CodeLearn Hub</h2>
        </div>
        <nav>
          <ul id="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li>
              <a href="tutorials.html">Tutorials & Exercises</a>
            </li>
            <li><a href="#" style="color: #004aad">Bookmark</a></li>
          </ul>
          <input
            type="search"
            id="search-bar"
            class="search"
            placeholder="Search Tutorials..."
          />
          <a href="login.html"
            ><button class="logout-btn" id="logout-btn">Logout</button></a
          >
          <button id="theme-switch">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#e3e3e3"
            >
              <path
                d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"
              />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#e3e3e3"
            >
              <path
                d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"
              />
            </svg>
          </button>
          <div class="menu-toggle" id="mobile-menu">&#9776;</div>
        </nav>
      </header>
      <main>
        <h1 style="color: var(--dark-text-color)">
          Bookmarked Tutorials and Exercises
        </h1>
        <div id="tutorial-modal" class="modal" style="display: none">
          <div class="modal-content">
            <span id="close-modal" class="close-button">&times;</span>

            <!-- Tutorial Section -->
            <h2 id="modal-tutorial_title"></h2>
            <p id="modal-tutorial_description"></p>
            <div
              id="modal-tutorial_content"
              class="modal-activity-content"
            ></div>

            <hr />

            <!-- Activity Section -->
            <h2 id="modal-activity_title"></h2>
            <p id="modal-activity_instruction"></p>

            <!-- Activity Answering Area -->
            <textarea
              id="user-code"
              rows="8"
              cols="50"
              placeholder="Write your answer here..."
            ></textarea>
            <br />
            <button onclick="checkCode()">Submit Answer</button>

            <!-- Loading and Result feedback -->
            <div id="loading" style="display: none">
              Checking your code... ⏳
            </div>
            <div id="result"></div>
          </div>
        </div>
        <div id="bookmark-container"></div>
      </main>
    </div>
    <!-- Footer -->
    <footer>
      <div class="footer">
        <p style="color: white">
          &copy; 2025 CodeLearn Hub. All Rights Reserved.
        </p>
      </div>
    </footer>
    <script>
      function checkCode() {
        const userCode = document.getElementById("user-code").value;
        const resultDiv = document.getElementById("result");
        const loadingDiv = document.getElementById("loading");

        resultDiv.innerHTML = "";
        loadingDiv.style.display = "block"; //Show loading animation

        setTimeout(() => {
          try {
            const originalConsoleLog = console.log;
            let logOutput = "";

            console.log = function (message) {
              logOutput += message + "<br>";
              originalConsoleLog(message);
            };

            eval(userCode); // ⚡ Execute the user code (define their function)

            console.log = originalConsoleLog; // Restore console.log

            loadingDiv.style.display = "none"; // Hide loading animation

            // ➡️ Now test their function output
            let testPassed = false;
            let expectedOutput = "Hello, Alice!";

            if (typeof sayHello === "function") {
              const userResult = sayHello("Alice"); // 🧪 Call the user's function
              if (userResult.trim() === expectedOutput) {
                testPassed = true;
              }
            }

            if (testPassed) {
              resultDiv.innerHTML = `
        <span style="color:green;">Correct! 🎉 Your function works as expected!</span><br><br>
        <strong>Console Output:</strong><br>${logOutput}`;
            } else {
              resultDiv.innerHTML = `
        <span style="color:red;">Almost there! ❌ Your function didn't return the correct result.</span><br><br>
        <strong>Expected:</strong> "${expectedOutput}"<br>
        <strong>Your Output:</strong> "${
          typeof sayHello === "function"
            ? sayHello("Alice")
            : "Function not found!"
        }"<br><br>
        <strong>Console Output:</strong><br>${logOutput}`;
            }
          } catch (error) {
            loadingDiv.style.display = "none"; // Hide loading on error
            resultDiv.innerHTML = `<span style="color:red;">Error:</span> ${error.message}`;
          }
        }, 500);
      }
    </script>
    <script src="scripts/app.js"></script>
  </body>
</html>
