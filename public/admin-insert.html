<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <title>Tutorial Management</title>
    <script>
        const role = localStorage.getItem("role");
        if (!role) {
          // Not logged in, redirect to login
          alert("You have to login first.");
          window.location.href = "login.html";
        }
        else{
          if (role !== "admin") {
                  alert("Access denied. Admins only.");
                  window.location.href = "login.html";
                }
        }
    </script>
</head>
<body class="">
  <div class="page-wrap">
    <!-- Navigation Bar -->
    <header>
        <div class="header-container">
            <img src="assets/danissa_logo.png" alt="Website Logo" class="logo-img">
            <h2 class="logo-text">CodeLearn Hub - Admin Dashboard</h2>
        </div>
        <nav>
          <ul id="nav-menu">
            <li><a href="admin-index.html">Home</a></li>
            <li><a href="admin-insert.html" style="color: #004aad">Add Tutorials & Exercises</a></li>
          </ul>
          <a href="login.html"><button class="logout-btn" id="logout-btn">Logout</button></a>
            <button id="theme-switch">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#e3e3e3"
              >
                <path
                  d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"
                />
              </svg>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#e3e3e3"
              >
                <path
                  d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"
                />
              </svg>
            </button>
    </header>
    <main>

    <div class="form-section">
      <h2>Tutorial</h2>
      <input type="text" id="tutorial-title" placeholder="Tutorial Title" required>
      <input type="text" id="tutorial-description" placeholder="Tutorial Description" required>
      <textarea id="tutorial-content" placeholder="Tutorial Content" required></textarea>
      <h2>Activity</h2>
      <input type="text" id="activity-title" placeholder="Activity Title" required>
      <textarea id="activity-instruction" placeholder="Activity Instructions" required></textarea>
      <textarea id="activity-answer" placeholder="Activity Answer" required></textarea>
      <button id="add-tutorial-btn">Add Tutorial & Activity</button>
    </div>
    </main>
  </div>
<footer>
  <div class="footer">
      <p style="color: white">&copy; 2025 CodeLearn Hub. All Rights Reserved.</p>
  </div>
</footer>
</body>
<script src="scripts/app.js"></script>
</html>
