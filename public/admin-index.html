    <title>Dashboard</title>
    <style>
       html, body {
          background-image: linear-gradient(
    to right,

        <script>
          const role = localStorage.getItem("role");
          if (!role) {
            // Not logged in, redirect to login
            window.location.href = "login.html";
          } else {
            if (role !== "admin") {
              alert("Access denied. Admin only.");
              window.location.href = "login.html";
            }
          }
      </script>
</head>
