<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/main.css" />
    <title>Signup</title>
    <script defer src="scripts/app.js"></script>
  </head>
  <body class="login">
    <main>
        <img src="assets/danissa_logo.png" alt="Website Logo" class="login-logo-img">
        <div class="login-form">
            <div class="login-form-box">
                <h2>Sign Up</h2>
                <form id="signup-form">
                    <input class="form-username" type="text" id="signup-username" placeholder="Enter username" required />
                    <input class="form-password" id="signup-password" placeholder="Enter password" required />
                    <button class="form-button" id="signup-btn" type="submit">Sign Up</button>
                  </form>
                <p style="margin-top: 15px;">
                    Already have an account? <a href="login.html" id="sign-up" onclick="signup()" style="color: #007BFF; text-decoration: none;">Click here</a>
                </p>
            </div>
        </div>
    </main>
</body>
</html>
  </section>
